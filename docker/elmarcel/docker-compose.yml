# Caddy serving the elmarcel.com static site.
# Deployed to /opt/elmarcel/ on the VPS by scripts/deploy/deploy-elmarcel.sh.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Mount the parent of the docroot: the deploy script atomically swaps
      # www/site.new -> www/site, which only stays visible to the container
      # if path resolution happens inside the mount on every request.
      - ./www:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - GARMIN_WEB_USER=${GARMIN_WEB_USER:-admin}
      # Required: an empty/unset hash makes Caddy's basic_auth directive
      # fail validation ("username and password cannot be empty") and
      # crash-loop, taking down www.elmarcel.com too since they share this
      # Caddy instance. This can happen if deploy-elmarcel.sh is run before
      # deploy-garmin.sh has ever populated /opt/elmarcel/.env. Fail fast
      # with a clear message instead of starting a crash-looping Caddy.
      - GARMIN_WEB_PASSWORD_HASH=${GARMIN_WEB_PASSWORD_HASH:?GARMIN_WEB_PASSWORD_HASH must be set — run deploy-garmin.sh at least once before (re)starting this stack}
    networks:
      - default
      - edge

networks:
  default:
  edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
